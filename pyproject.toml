[project]
name = "certificate-analyzer"
version = "0.1.0"
description = "Анализатор сертификатов X.509 и машиночитаемых доверенностей"
readme = "README.md"
authors = [
    { name = "kanl", email = "106077541+kanl222@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "openpyxl>=3.1",
    "reportlab>=4",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "sqlalchemy>=2.0.54",
]

[project.optional-dependencies]
gui = ["pyperclip>=1.8"]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "win10toast>=0.9; sys_platform == 'win32'",
    # win10toast 0.9 imports pkg_resources, removed in newer setuptools.
    "setuptools<81; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
packaging = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "legacy",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "W291", "W292", "W293"]

[project.scripts]
certificate-analyzer = "certificate_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
