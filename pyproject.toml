[project]
name = "certificate-analyzer"
version = "0.1.0"
description = "Анализатор сертификатов X.509 и машиночитаемых доверенностей"
readme = "README.md"
authors = [
    { name = "kanl", email = "106077541+kanl222@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "openpyxl>=3.1",
    "reportlab>=4",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "sqlalchemy>=2.0.54",
    "matplotlib>=3.11.2",
    "tkcalendar>=1.6.1",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
gui = ["matplotlib>=3.8", "tkcalendar>=1.6", "pyperclip>=1.8"]
windows = ["pywin32>=306; sys_platform == 'win32'", "win10toast>=0.9; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
certificate-analyzer = "certificate_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
